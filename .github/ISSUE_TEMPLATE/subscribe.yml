name: Subscribe
description: Subscribe to the free NEWS AI newsletter
title: "Subscribe"
labels: ["subscribe"]
body:
  - type: markdown
    attributes:
      value: |
        ## Subscribe to NEWS

        Enter your email below. It will be added to `data/subscribers.json` (a public file in this repository).

        No external services. Forever free. You can unsubscribe anytime by opening another issue.

  - type: input
    id: email
    attributes:
      label: Email address
      description: Your email for the newsletter
      placeholder: you@example.com
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: I understand my email will be stored in a public JSON file in this repository
          required: true
